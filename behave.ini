# ---------------------------------------------------------------------------------------
# behave configuration for DataSentinel.  Full guide: docs/03-configuration-reference.md
# ---------------------------------------------------------------------------------------
[behave]
paths = features

# Two reports per plain `behave` run:
#   html   -> the standard BDD report (branded), written to the file listed in `outfiles`
#   pretty -> readable console output (no outfile = stdout)
# Formats are paired with outfiles in order; formats without an outfile go to stdout.
format = html
         pretty
outfiles = reports/behave_report.html

# Scenarios carrying these tags are skipped unless you pass --tags=... yourself:
#   @requires_creds   needs real Snowflake/Oracle/Databricks credentials
#   @requires_browser needs Playwright browsers  (pip install playwright && playwright install chromium)
#   @demo_fail        fails ON PURPOSE to show how failures look in the reports
default_tags = -@requires_creds
               -@requires_browser
               -@demo_fail

show_skipped = false
junit = true
junit_directory = reports/junit

[behave.formatters]
# Branded subclass of behave-html-formatter (adds the framework name to the standard report)
html = datasentinel.reporting.bdd_html:BrandedHTMLFormatter
